name: Refactoring
description: Propose an internal code improvement without changing behavior.
title: "[Refactor]: "
body:
  - type: textarea
    id: area
    attributes:
      label: Area to refactor
      description: Identify the code, module, or component.
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Motivation
      description: Explain the current issue and why a refactor would help.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Describe a possible approach, if you have one.
    validations:
      required: false
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: List the conditions that would make this refactoring complete.
    validations:
      required: false
