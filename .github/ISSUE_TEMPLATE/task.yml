name: Task
description: Track a task that does not fit another issue category.
title: "[Task]: "
body:
  - type: textarea
    id: task
    attributes:
      label: Task
      description: Describe the work to be done and its intended outcome.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: List the main activities or constraints.
    validations:
      required: false
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: List the conditions that must be met to complete this task.
    validations:
      required: false
